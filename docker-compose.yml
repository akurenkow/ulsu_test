# Smart Logistics Data & ML Platform — локальная инфраструктура.
# Одна команда: `docker compose up -d` (или `docker-compose up -d`).
#
# Конфигурация читается только из переменных окружения (файл `.env`,
# шаблон — `.env.example`). Все значения имеют dev-дефолты, поэтому
# проект поднимается даже без `.env`.
#
# Обязательная часть: сервис `postgres` (+ профили `etl`/`ml` для ручных прогонов).
# Бонусные сервисы (★) поднимаются отдельными профилями и НЕ трогаются обычным
# `docker compose up`:
#   docker compose --profile airflow up -d     # Apache Airflow (оркестрация)
#   docker compose --profile superset up -d    # Apache Superset (BI)
#   docker compose --profile clickhouse up -d  # ClickHouse (аналитический слой)

x-airflow-common: &airflow-common
  image: ulog-airflow:latest
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    # --- Ядро Airflow -------------------------------------------------------
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-VrmpiH-KqsJGYLbddvb_0_OPC2XUwpMWU4VkzKYgvI8=}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-_HoTiqYe10IsBZnR0qVhQHfFNqEElW5ErsELFBJvmGs}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres-airflow:5432/${AIRFLOW_POSTGRES_DB:-airflow}
    AIRFLOW_CONN_POSTGRES_ETL: postgresql://${DWH_USER:-dwh_user}:${DWH_PASSWORD:-dwh_password}@postgres:5432/${DWH_DB:-dwh}
    # --- Админ UI Airflow (используется airflow-init) -----------------------
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
    AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-User}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    # --- Переменные окружения приложения (common/config.py, etl/ml) ---------
    DB_HOST: postgres
    DB_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
    DWH_DB: ${DWH_DB:-dwh}
    DWH_USER: ${DWH_USER:-dwh_user}
    DWH_PASSWORD: ${DWH_PASSWORD:-dwh_password}
    AS_OF: ${AS_OF:-2026-10-26}
    RANDOM_SEED: ${RANDOM_SEED:-0.20261026}
    ML_RANDOM_SEED: ${ML_RANDOM_SEED:-42}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # --- Для задачи init_source (переиспользование docker/postgres/init) ----
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    N_PRICES: ${N_PRICES:-300000}
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./common:/opt/airflow/common:ro
    - ./etl:/opt/airflow/etl:ro
    - ./ml:/opt/airflow/ml:ro
    - ./sql:/opt/sql:ro
    - ./docker/postgres/init:/opt/ulog-init:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # Docker по умолчанию даёт контейнеру /dev/shm всего 64 МБ; параллельные
    # агрегаты PostgreSQL (percentile_cont и пр.) упираются в него ошибкой
    # «could not resize shared memory segment». Расширяем под аналитику.
    shm_size: "512m"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
      # Передаются в init-скрипты docker/postgres/init/*.sh
      DWH_DB: ${DWH_DB:-dwh}
      DWH_USER: ${DWH_USER:-dwh_user}
      DWH_PASSWORD: ${DWH_PASSWORD:-dwh_password}
      N_PRICES: ${N_PRICES:-300000}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/opt/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-deals_bigdata}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ETL-пайплайн (этап 2). Не стартует при обычном `up`; запускается по требованию:
  #   docker compose --profile etl run --rm etl python -m etl.main --start-date ... --end-date ...
  etl:
    build:
      context: .
      dockerfile: Dockerfile.etl
    image: ulog-etl:latest
    profiles: ["etl"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
      DWH_DB: ${DWH_DB:-dwh}
      DWH_USER: ${DWH_USER:-dwh_user}
      DWH_PASSWORD: ${DWH_PASSWORD:-dwh_password}
      AS_OF: ${AS_OF:-2026-10-26}
      RANDOM_SEED: ${RANDOM_SEED:-0.20261026}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Для переливки витрин в ClickHouse (бонус ★, этап 3)
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_NATIVE_PORT: 9000
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-dwh}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "etl.main", "--help"]

  # ML-пайплайн (этап 4). Запускается по требованию:
  #   docker compose --profile ml run --rm ml python -m ml.main
  ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: ulog-ml:latest
    profiles: ["ml"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
      DWH_DB: ${DWH_DB:-dwh}
      DWH_USER: ${DWH_USER:-dwh_user}
      DWH_PASSWORD: ${DWH_PASSWORD:-dwh_password}
      AS_OF: ${AS_OF:-2026-10-26}
      RANDOM_SEED: ${RANDOM_SEED:-0.20261026}
      ML_RANDOM_SEED: ${ML_RANDOM_SEED:-42}
      ML_POINT_LOSS: ${ML_POINT_LOSS:-RMSE}
      ML_DEPTH: ${ML_DEPTH:-6}
      ML_L2_LEAF_REG: ${ML_L2_LEAF_REG:-3.0}
      ML_LEARNING_RATE: ${ML_LEARNING_RATE:-0.03}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-/app/ml/artifacts/catboost.cbm}
    volumes:
      - ml_artifacts:/app/ml/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "ml.main", "--help"]

  # ==========================================================================
  # API демо-дашборда «Рынок ставок» — отдаёт реальные агрегаты из DWH
  # (core.prices) в формате bigdata-demo.html. FastAPI, один контейнер.
  #   Swagger UI: http://localhost:8000/docs
  #   Health:     http://localhost:8000/health
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ulog-api:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DWH_DB: ${DWH_DB:-dwh}
      DWH_USER: ${DWH_USER:-dwh_user}
      DWH_PASSWORD: ${DWH_PASSWORD:-dwh_password}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ==========================================================================
  # Бонус ★: Apache Airflow — оркестрация пайплайна.
  #   docker compose --profile airflow up -d
  # UI: http://localhost:8080 (логин AIRFLOW_ADMIN_USER / AIRFLOW_ADMIN_PASSWORD).
  # ==========================================================================
  postgres-airflow:
    image: postgres:17
    profiles: ["airflow"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER:-airflow} -d ${AIRFLOW_POSTGRES_DB:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 30

  airflow-init:
    <<: *airflow-common
    restart: "no"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        # `|| true`: повторный запуск при существующем пользователе не должен ронять init.
        airflow users create --role Admin \
          --username "$${AIRFLOW_ADMIN_USER:-admin}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname "$${AIRFLOW_ADMIN_FIRSTNAME:-Admin}" \
          --lastname "$${AIRFLOW_ADMIN_LASTNAME:-User}" \
          --email "$${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "${AIRFLOW_WWW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  # ==========================================================================
  # Бонус ★: Apache Superset — BI-дашборд.
  #   docker compose --profile superset up -d
  # UI: http://localhost:8088 (логин SUPERSET_ADMIN_USER / SUPERSET_ADMIN_PASSWORD).
  # ==========================================================================
  superset:
    image: apache/superset:4.0.2
    profiles: ["superset"]
    restart: unless-stopped
    user: root
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-_HoTiqYe10IsBZnR0qVhQHfFNqEElW5ErsELFBJvmGs}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Admin}
      SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-User}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      # Подключение к DWH (используется bootstrap'ом и импортом демо-дашборда)
      SUPERSET_DWH_URI: postgresql+psycopg2://${DWH_USER:-dwh_user}:${DWH_PASSWORD:-dwh_password}@postgres:5432/${DWH_DB:-dwh}
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./superset:/opt/superset:ro
    entrypoint: ["/bin/bash"]
    command: ["/opt/superset/superset-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # Бонус ★: ClickHouse — аналитический слой (MergeTree / ReplacingMergeTree).
  #   docker compose --profile clickhouse up -d
  # HTTP: http://localhost:8123, native: localhost:9000.
  # DDL: sql/clickhouse/00_schema.sql (выполняется при первой инициализации).
  # ==========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["clickhouse"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-dwh}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_logs:
  superset_home:
  clickhouse_data:
  ml_artifacts:
